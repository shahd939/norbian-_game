<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية تبيان لتعليم القرآن 🎈</title>
    <style>
        :root {
            --primary-color: #ff6f91;
            --secondary-color: #4dadf7;
            --success-color: #4caf50;
        }

        * {
            box-sizing: border-box; /* لضمان دقة حسابات الأبعاد */
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            font-family: 'Arial', Tahoma, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #e0f7fa, #fff9c4);
            box-shadow: 0 0 25px rgba(0,0,0,0.15);
            overflow: hidden;
            border-left: 4px dashed #fff;
            border-right: 4px dashed #fff;
        }

        #header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            color: #37474f;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 0 0 20px 20px;
            margin: 0 5px;
        }

        .badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
        }

        #target-box {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 16px;
        }

        /* حاوية الحرف - فقاعة واضحة ومستقرة ومضبوطة للموبايل */
        .letter-container {
            position: absolute;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            width: 75px;
            height: 75px;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            pointer-events: none;
        }

        .main-char {
            font-size: 30px; /* تقليل بسيط لضمان الاحتواء الكامل */
            font-weight: bold;
            color: #333;
            line-height: 1.1;
            text-align: center;
        }

        .diacritic {
            font-size: 28px; /* ضبط الحجم ليناسب الشاشات الصغيرة */
            font-weight: bold;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 0;
            margin-bottom: 5px; /* مسافة متناسقة بين الحرف وتشكيله */
        }

        /* السلة وتصميم التشكيل عليها */
        #basket {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 75px;
            background: linear-gradient(to bottom, #a1887f, #8d6e63);
            border-radius: 5px 5px 35px 35px;
            border: 4px solid #5d4037;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        #basket::before {
            content: "🧺";
            font-size: 40px;
            position: absolute;
            top: -35px;
        }

        /* تعديل المربع ليكون التشكيل في السنتر تماماً على الهاتف والكمبيوتر */
        #basket-label {
            background: #fff;
            color: #d32f2f;
            font-size: 45px; 
            font-weight: bold;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%; 
            border: 3px solid #ff9800;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-top: 10px;
            z-index: 6;
            line-height: 0; 
            padding-bottom: 24px; /* لرفع التشكيل وتوسيطه بدقة داخل الدائرة */
            text-align: center;
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #level-splash {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(77, 173, 247, 0.95);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 85%;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fatha-btn { background: #ff9800; }
        .damma-btn { background: #2196f3; }
        .kasra-btn { background: #00bcd4; }
        .sukun-btn { background: #9c27b0; }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div>النقاط: <span id="score" style="color: #e91e63;">0</span> 🌟</div>
        <div id="level-badge" class="badge">المستوى: 1 🚀</div>
        <div id="target-box">المطلوب: الفتحة ✨</div>
    </div>

    <div id="basket">
        <div id="basket-label">َ</div>
    </div>

    <div id="level-splash">
        <h1 style="font-size: 60px;">🚀</h1>
        <h2 id="splash-level-text" style="font-size: 35px;">المستوى 2</h2>
        <p>أسرع يا بطل! 🔥</p>
    </div>

    <div id="main-menu" class="overlay-screen">
        <h1 style="color: #ff6f91; font-size: 28px; text-align:center;">أكاديمية تبيان لتعليم القرآن</h1>
        <p>اختر الحركة لصيدها:</p>
        <div class="mode-grid">
            <button class="mode-btn fatha-btn" onclick="selectMode('fatha', 'الفتحة ✨', 'َ')">الفتحة ☀️<span>أَ</span></button>
            <button class="mode-btn damma-btn" onclick="selectMode('damma', 'الضمة ☁️', 'ُ')">الضمة ☁️<span>أُ</span></button>
            <button class="mode-btn kasra-btn" onclick="selectMode('kasra', 'الكسرة 💧', 'ِ')">الكسرة 💧<span>إِ</span></button>
            <button class="mode-btn sukun-btn" onclick="selectMode('sukun', 'السكون ❄️', 'ْ')">السكون ❄️<span>بْ</span></button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #f44336;">حاول مرة أخرى! 💔</h1>
        <p id="error-reason" style="font-size: 18px; text-align: center; padding: 0 20px;"></p>
        <h2>النقاط: <span id="final-score">0</span></h2>
        <button class="btn" onclick="resetGame()">إعادة المحاولة 🔄</button>
        <button class="btn" style="background: #9e9e9e;" onclick="backToMenu()">القائمة الرئيسية 🏠</button>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const basket = document.getElementById('basket');
    const basketLabel = document.getElementById('basket-label');
    const scoreDisplay = document.getElementById('score');
    const levelBadge = document.getElementById('level-badge');
    const mainMenu = document.getElementById('main-menu');
    const gameOverScreen = document.getElementById('game-over-screen');
    const levelSplash = document.getElementById('level-splash');
    
    let score = 0;
    let currentLevel = 1;
    let startSpeed = 2.0;
    let currentSpeed = startSpeed;
    let gameActive = false;
    let letterInterval;
    let lastXPosition = -1;
    let selectedGameMode = 'fatha';

    const letterPool = {
        fatha: [
            { char: "أ", diac: "َ", pos: "top", type: "fatha" }, { char: "ب", diac: "َ", pos: "top", type: "fatha" },
            { char: "س", diac: "ِ", pos: "bottom", type: "kasra" }, { char: "م", diac: "ُ", pos: "top", type: "damma" }
        ],
        damma: [
            { char: "أ", diac: "ُ", pos: "top", type: "damma" }, { char: "ت", diac: "ُ", pos: "top", type: "damma" },
            { char: "ر", diac: "َ", pos: "top", type: "fatha" }, { char: "ج", diac: "ِ", pos: "bottom", type: "kasra" }
        ],
        kasra: [
            { char: "إ", diac: "ِ", pos: "bottom", type: "kasra" }, { char: "ب", diac: "ِ", pos: "bottom", type: "kasra" },
            { char: "د", diac: "َ", pos: "top", type: "fatha" }, { char: "ف", diac: "ُ", pos: "top", type: "damma" }
        ],
        sukun: [
            { char: "ب", diac: "ْ", pos: "top", type: "sukun" }, { char: "م", diac: "ْ", pos: "top", type: "sukun" },
            { char: "أ", diac: "َ", pos: "top", type: "fatha" }, { char: "ك", diac: "ُ", pos: "top", type: "damma" }
        ]
    };

    window.addEventListener('mousemove', (e) => { moveBasket(e.clientX); });
    window.addEventListener('touchmove', (e) => { if(e.touches[0]) moveBasket(e.touches[0].clientX); }, { passive: true });

    function moveBasket(xPos) {
        if (!gameActive) return;
        const rect = container.getBoundingClientRect();
        let relativeX = xPos - rect.left;
        let halfBasket = basket.offsetWidth / 2;
        // منع السلة من الخروج من الحواف
        if (relativeX < halfBasket) relativeX = halfBasket;
        if (relativeX > rect.width - halfBasket) relativeX = rect.width - halfBasket;
        basket.style.left = relativeX + 'px';
    }

    function selectMode(mode, targetText, basketText) {
        selectedGameMode = mode;
        basketLabel.innerText = basketText;
        document.getElementById('target-box').innerText = `المطلوب: ${targetText}`;
        mainMenu.style.display = 'none';
        startGame();
    }

    function createLetter() {
        if (!gameActive) return;

        const activePool = letterPool[selectedGameMode];
        const letterData = activePool[Math.floor(Math.random() * activePool.length)];
        
        const containerEl = document.createElement('div');
        containerEl.classList.add('letter-container');
        
        const diacriticEl = document.createElement('div');
        diacriticEl.classList.add('diacritic');
        diacriticEl.innerText = letterData.diac;

        const charEl = document.createElement('div');
        charEl.classList.add('main-char');
        charEl.innerText = letterData.char;

        if (letterData.pos === "top") {
            containerEl.appendChild(diacriticEl);
            containerEl.appendChild(charEl);
        } else {
            containerEl.appendChild(charEl);
            containerEl.appendChild(diacriticEl);
        }

        // حل مشكلة أطراف الشاشة:
        const margin = 45;
        const availableWidth = container.offsetWidth - (margin * 2);
        let randomX;
        
        do {
            randomX = Math.random() * availableWidth + margin;
        } while (lastXPosition !== -1 && Math.abs(randomX - lastXPosition) < 80);
        
        lastXPosition = randomX;
        containerEl.style.left = randomX + 'px';
        containerEl.style.transform = 'translateX(-50%)'; // لضمان أن الإحداثي هو مركز الفقاعة
        containerEl.style.top = '-80px';
        container.appendChild(containerEl);

        let topPos = -80;
        const fallSpeed = currentSpeed + (Math.random() * 0.5);

        function fall() {
            if (!gameActive) { containerEl.remove(); return; }
            topPos += fallSpeed;
            containerEl.style.top = topPos + 'px';

            const bRect = basket.getBoundingClientRect();
            const lRect = containerEl.getBoundingClientRect();

            // منطقة اصطدام دقيقة جداً ومحسنة للموبايل
            if (
                lRect.bottom >= bRect.top + 20 && 
                lRect.right - 15 >= bRect.left &&
                lRect.left + 15 <= bRect.right &&
                lRect.top <= bRect.bottom
            ) {
                if (letterData.type === selectedGameMode) {
                    score += 10;
                    scoreDisplay.innerText = score;
                    containerEl.remove();
                    checkLevelUp();
                } else {
                    containerEl.remove();
                    let types = {fatha:'مفتوحاً', damma:'مضموماً', kasra:'مكسوراً', sukun:'ساكناً'};
                    triggerGameOver(`التقطت حرفاً ${types[letterData.type]}!`);
                }
                return;
            }

            if (topPos > container.offsetHeight) {
                containerEl.remove();
            } else {
                requestAnimationFrame(fall);
            }
        }
        requestAnimationFrame(fall);
    }

    function checkLevelUp() {
        let targetLevel = Math.floor(score / 70) + 1;
        if (targetLevel > currentLevel) {
            currentLevel = targetLevel;
            // زيادة الصعوبة بمعدل 0.6+ لكل مستوى ليناسب الموبايل
            currentSpeed = startSpeed + (currentLevel - 1) * 0.6; 
            showLevelSplash();
        }
    }

    function showLevelSplash() {
        gameActive = false;
        clearInterval(letterInterval);
        document.getElementById('splash-level-text').innerText = `المستوى ${currentLevel}`;
        levelSplash.style.display = 'flex';
        setTimeout(() => {
            levelSplash.style.display = 'none';
            gameActive = true;
            let intervalTime = Math.max(700, 1600 - (currentLevel * 60));
            letterInterval = setInterval(createLetter, intervalTime);
        }, 2000);
    }

    function startGame() {
        score = 0; currentLevel = 1; currentSpeed = startSpeed;
        gameActive = true;
        scoreDisplay.innerText = score;
        levelBadge.innerText = "المستوى: 1 🚀";
        gameOverScreen.style.display = 'none';
        letterInterval = setInterval(createLetter, 1600);
    }

    function triggerGameOver(reason) {
        gameActive = false;
        clearInterval(letterInterval);
        document.getElementById('error-reason').innerText = reason;
        document.getElementById('final-score').innerText = score;
        gameOverScreen.style.display = 'flex';
    }

    function resetGame() { startGame(); }
    function backToMenu() {
        gameOverScreen.style.display = 'none';
        mainMenu.style.display = 'flex';
    }
</script>

</body>
</html>
